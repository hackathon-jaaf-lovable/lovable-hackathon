<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Public Speaking Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h1>Audience Simulator</h1>
  <div id="chat">
    <div id="messages"></div>
    <input id="user-input" type="text" placeholder="Say something"/>
    <button onclick="sendMessage()">Send</button>
  </div>
  <p><a href="/coach">Go to Speech Coach</a></p>
<script>
function appendMessage(text) {
  const div = document.createElement('div');
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
}
function sendMessage() {
  const input = document.getElementById('user-input');
  const message = input.value;
  appendMessage('You: ' + message);
  axios.post('/audience', {message}).then(resp => {
    appendMessage('Audience: ' + resp.data.response);
  });
  input.value = '';
}
</script>
</body>
</html>
