<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Speech Coach</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h1>Speech Coach</h1>
  <video id="camera" width="640" height="480" autoplay></video>
  <button onclick="analyze()">Analyze Body Language</button>
  <div id="tips"></div>
  <p><a href="/">Back to Audience Simulator</a></p>
<script>
// Access webcam
navigator.mediaDevices.getUserMedia({video: true}).then(stream => {
  document.getElementById('camera').srcObject = stream;
});
function analyze() {
  // TODO: send video frame to server for analysis
  axios.post('/analyze', {}).then(resp => {
    document.getElementById('tips').innerText = resp.data.tips;
  });
}
</script>
</body>
</html>
